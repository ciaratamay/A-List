window._setTab=id=>{
  // Save current add name draft before switching tabs
  const ne=document.getElementById('new-name');if(ne)addNameDraft=ne.value;
  activeTab=id;confirmId=null;confirmClear=false;confirmDelete=null;
  editId=null;editDraft=null;pendingAdd=null;sortMenuOpen=false;
  confirmMealOff=null;confirmMealDel=null;mealSortMenuOpen=false;mealFilterMenuOpen=false;mealAdvOpen=null;editMealId=null;mealEditDraft=null;
  addNameDraft='';
  const t=tabById(id);
  addDraftShops=(t&&t.type==='shop')?[id]:[];
  render();
};
window._setSort=a=>{sortAlpha=a;sortMenuOpen=false;render()};
window._toggleSortMenu=()=>{sortMenuOpen=!sortMenuOpen;render()};
window._openModal=name=>{modal=name;render()};
window._closeModal=()=>{modal=null;modal_deleteLocalId=null;modal_extra=null;render()};
window._openManage=name=>{confirmDelete=null;modal=name;render()};
window._closeManageModal=()=>{confirmDelete=null;modal=null;render()};
window._openBurger=()=>{burgerOpen=true;render()};
window._closeBurger=()=>{burgerOpen=false;render()};
window._doQuit=()=>window.close();


window._closeCurrentList=closeCurrentList;
window._doUndo=()=>popUndo();

window._doNewList=()=>{
  const nameEl=document.getElementById('nl-name'),errEl=document.getElementById('nl-err');
  const name=nameEl?.value.trim();
  if(!name){if(errEl)errEl.textContent='Please enter a name.';return;}
  const localId='list_'+Date.now();
  const newList=makeEmptyList(name,localId);
  allLists.push({localId,name,listId:null,pw:null,pwHint:null,isShared:false,lastOpened:Date.now()});
  ss('sl_all_lists',allLists);
  ss('sl_list_'+localId,{items:newList.items,shopTabs:newList.shopTabs,cats:newList.cats,todoItems:newList.todoItems,meals:newList.meals,mealCats:newList.mealCats,mealIcons:newList.mealIcons,nextId:newList.nextId,nextTodoId:newList.nextTodoId,nextMealId:newList.nextMealId});
  if(firestoreUnsub){firestoreUnsub();firestoreUnsub=null;}
  syncStatus='off';list=newList;activeLocalId=localId;ss('sl_active_local',localId);
  resetUIState();render();
};

window._doCopyList=()=>{
  if(!list)return;
  const nameEl=document.getElementById('copy-name'),errEl=document.getElementById('copy-err');
  const name=nameEl?.value.trim();
  if(!name){if(errEl)errEl.textContent='Please enter a name.';return;}
  const localId='list_'+Date.now();
  const copy={localId,name,listId:null,pw:null,pwHint:null,isShared:false,
    items:clone(list.items),shopTabs:clone(list.shopTabs),cats:clone(list.cats),
    todoItems:clone(list.todoItems),meals:clone(list.meals||[]),mealCats:clone(list.mealCats||[]),mealIcons:clone(list.mealIcons||[]),nextId:list.nextId,nextTodoId:list.nextTodoId,nextMealId:list.nextMealId||1};
  allLists.push({localId,name,listId:null,pw:null,pwHint:null,isShared:false,lastOpened:Date.now()});
  ss('sl_all_lists',allLists);
  ss('sl_list_'+localId,{items:copy.items,shopTabs:copy.shopTabs,cats:copy.cats,todoItems:copy.todoItems,meals:copy.meals,mealCats:copy.mealCats,mealIcons:copy.mealIcons,nextId:copy.nextId,nextTodoId:copy.nextTodoId,nextMealId:copy.nextMealId});
  if(firestoreUnsub){firestoreUnsub();firestoreUnsub=null;}
  syncStatus='off';list=copy;activeLocalId=localId;ss('sl_active_local',localId);
  resetUIState();render();
};

window._doOpenList=localId=>{_closeModal();openList(localId)};
window._promptDeleteList=localId=>{modal_deleteLocalId=localId;modal='delete-list-confirm';renderModal()};
window._doDeleteList=()=>{if(!modal_deleteLocalId)return;const id=modal_deleteLocalId;_closeModal();deleteLocalList(id)};

window._doShare=async()=>{
  if(!list)return;
  const pw=document.getElementById('share-pw')?.value||'';
  const hint=document.getElementById('share-hint')?.value||'';
  const errEl=document.getElementById('share-err');
  if(pw.length<4){if(errEl)errEl.textContent='Password must be at least 4 characters.';return;}
  if(errEl)errEl.textContent='Uploading…';
  try{await doShareListAction(pw,hint);_closeModal();modal='share-success';modal_extra=pw;render();}
  catch(e){if(errEl)errEl.textContent='Error: '+e.message;}
};

window._doJoinList=async()=>{
  const idEl=document.getElementById('join-id'),pwEl=document.getElementById('join-pw'),errEl=document.getElementById('join-err');
  const listId=idEl?.value.trim(),pw=pwEl?.value.trim();
  if(!listId){if(errEl)errEl.textContent='Enter a list ID.';return;}
  if(!pw){if(errEl)errEl.textContent='Enter the password.';return;}
  if(errEl)errEl.textContent='Connecting…';
  try{await doJoinSharedList(listId,pw);_closeModal();}
  catch(e){if(errEl)errEl.textContent=e.message;}
};

window._copyListId=()=>{if(!list||!list.listId)return;_clipCopy(list.listId,'copy-id-btn','Copy')};

/* ══════════════════════════════════════
   ITEM ACTIONS
══════════════════════════════════════ */
window._toggleItem=id=>{if(!list)return;const i=list.items.find(x=>x.id===id);if(i){i.needed=!i.needed;persistList();render();}};
window._toggleStar=id=>{if(!list)return;const i=list.items.find(x=>x.id===id);if(i){i.starred=!i.starred;persistList();render();}};
window._setGroupByCat=v=>{groupByCat=!!v;ss('sl_group_by_cat',groupByCat);render();};
window._setShopOnly=(shopId,v)=>{setShopOnly(shopId,v);render();};
window._toggleSummary=()=>{summaryCollapsed=!summaryCollapsed;ss('sl_summary_collapsed',summaryCollapsed);render();};
window._copySummary=()=>{_clipCopy(buildListSummary(),'summary-copy-btn',`${copyIcon()} Copy`);};
window._askDelete=id=>{confirmId=id;confirmClear=false;editId=null;editDraft=null;render()};
window._cancelConfirm=()=>{confirmId=null;confirmClear=false;confirmDelete=null;confirmTodoDel=null;confirmMealOff=null;confirmMealDel=null;render()};

   COPY / EXPORT
══════════════════════════════════════ */
function shopSuffix(item){
  if(!item.shops.length)return'';
  return' ('+item.shops.map(s=>{const t=tabById(s);return t?t.label:s}).join(', ')+')';
}

// Build a categorised block from an item list, with optional shop suffix
function buildCatBlock(items, showShopSuffix){
  const lines=[];
  const m={};catList().forEach(c=>{m[c]=[]});
  items.forEach(i=>{const c=i.cat&&m[i.cat]!==undefined?i.cat:'Uncategorised';if(!m[c])m[c]=[];m[c].push(i)});
  catList().forEach(cat=>{
    if(!(m[cat]||[]).length)return;
    lines.push(cat+':');
    m[cat].forEach(i=>lines.push('• '+i.name+(showShopSuffix?shopSuffix(i):'')));
    lines.push('');
  });
  return lines;
}

function buildExportAll(){
  if(!list)return'';
  // All Shopping: items grouped by category, shop name in brackets if assigned
  const needed=list.items.filter(i=>i.needed).slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(!needed.length)return'ALL SHOPPING\n\n(nothing toggled)';
  const lines=['ALL SHOPPING',''];
  lines.push(...buildCatBlock(needed, true));
  return lines.join('\n').trim();
}

function buildExportTabOnly(){
  // Shop tab — only items tagged to this shop
  if(!list)return'';
  const tab=tabById(activeTab);
  const label=tab?tab.label:'List';
  const needed=list.items.filter(i=>i.shops.includes(activeTab)&&i.needed).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const lines=[label.toUpperCase(),''];
  if(!needed.length){lines.push('(nothing toggled)');return lines.join('\n').trim();}
  lines.push(...buildCatBlock(needed, false));
  return lines.join('\n').trim();
}

function buildExportTabPlusGeneral(){
  // Shop tab + items with no shop assigned
  if(!list)return'';
  const tab=tabById(activeTab);
  const label=tab?tab.label:'List';
  const shopItems=list.items.filter(i=>i.shops.includes(activeTab)&&i.needed).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const generalItems=list.items.filter(i=>i.shops.length===0&&i.needed).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const lines=[label.toUpperCase()+' + ANY SHOP ITEMS',''];
  if(!shopItems.length&&!generalItems.length){lines.push('(nothing toggled)');return lines.join('\n').trim();}
  if(shopItems.length){
    lines.push(label.toUpperCase()+':','');
    lines.push(...buildCatBlock(shopItems, false));
  }
  if(generalItems.length){
    lines.push('ANY SHOP:','');
    lines.push(...buildCatBlock(generalItems, false));
  }
  return lines.join('\n').trim();
}

function buildExportTodo(){
  if(!list)return'';
  const lines=['TO DO',''];
  const items=list.todoItems.filter(t=>!t.done);
  if(!items.length){lines.push('(nothing to do)');return lines.join('\n').trim();}
  items.forEach(t=>lines.push('• '+t.text));
  return lines.join('\n').trim();
}

window._doCopy=mode=>{
  let text='',btnId='',label='';
  const tab=tabById(activeTab);
  if(mode==='all'){text=buildExportAll();btnId='cp-all';label='Copy All Shopping';}
  else if(mode==='tab'){text=buildExportTabOnly();btnId='cp-tab';label=`Copy ${tab?tab.label:''} only`;}
  else if(mode==='tab-plus-general'){text=buildExportTabPlusGeneral();btnId='cp-tab-gen';label=`Copy ${tab?tab.label:''} + Any Shop Items`;}
  else if(mode==='todo-only'){text=buildExportTodo();btnId='cp-todo';label='Copy To Do list';}
  _clipCopy(text,btnId,`${copyIcon()} ${label}`);
};

function _clipCopy(text,btnId,origHtml){
  function ok(){const b=document.getElementById(btnId);if(b){b.innerHTML=`${copyIcon()} ✓ Copied!`;b.classList.add('done');setTimeout(()=>{b.innerHTML=origHtml;b.classList.remove('done')},2200)}}
  function fail(){const b=document.getElementById(btnId);if(b){b.textContent='Copy failed';setTimeout(()=>{b.innerHTML=origHtml},2000)}}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok).catch(()=>execCopy(text,ok,fail));
  else execCopy(text,ok,fail);
}
function execCopy(text,onOk,onFail){
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{const ok=document.execCommand('copy');document.body.removeChild(ta);ok?onOk():onFail();}
  catch(e){document.body.removeChild(ta);onFail();}
}

window._openImport=async()=>{
  let clipText='';
  try{if(navigator.clipboard&&window.isSecureContext)clipText=await navigator.clipboard.readText();}catch(e){clipText='';}
  modal_extra=clipText;modal='import';render();

window._runImport=()=>{
  if(!list)return;
  const ta=document.getElementById('import-ta');
  const text=ta?.value.trim();
  if(!text){_closeModal();return;}
  pushUndo('Import');
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);

  // Helpers
  function ensureShop(label){
    const low=label.toLowerCase();
    let found=list.shopTabs.find(t=>t.label.toLowerCase()===low);
    if(!found){
      const id=low.replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
      const existId=list.shopTabs.find(t=>t.id===id);
      found=existId||{id,label:normName(label),type:'shop'};
      if(!existId)list.shopTabs.push(found);
    }
    return found;
  }
  function ensureCat(name){
    if(!name||name.toLowerCase()==='uncategorised')return'Uncategorised';
    const match=list.cats.find(c=>c.toLowerCase()===name.toLowerCase());
    if(match)return match;
    const proper=normName(name);
    const idx=list.cats.indexOf('Uncategorised');
    if(idx>=0)list.cats.splice(idx+1,0,proper);else list.cats.push(proper);
    return proper;
  }

  let currentShopId=null;
  let currentCat='Uncategorised';
  const itemsToMerge=[];

  lines.forEach((line,i)=>{
    const clean=line.replace(/^[•\-\*]\s*/,'').trim();
    if(!clean)return;
    const low=clean.toLowerCase();

    // Category header: line ending with colon
    if(low.endsWith(':')){
      const catName=clean.slice(0,-1).trim();
      currentCat=ensureCat(catName);
      return;
    }

    // Shop header on first line or matching a shop name (no colon, no bullet originally)
    if(i===0&&!line.startsWith('•')&&!line.startsWith('-')){
      if(low==='all shopping'||low==='groceries'){currentShopId='all';return;}
      const knownShop=list.shopTabs.find(t=>t.label.toLowerCase()===low);
      if(knownShop){currentShopId=knownShop.id;return;}
    }

    // Extract shop hints from brackets: "Milk (Aldi, Tesco)"
    const bracketMatch=clean.match(/\(([^)]+)\)\s*$/);
    const itemName=clean.replace(/\s*\(([^)]+)\)\s*$/,'').trim();
    if(!itemName)return;

    let inlineShops=[];
    if(bracketMatch){
      const parts=bracketMatch[1].split(',').map(s=>s.trim()).filter(Boolean);
      parts.forEach(part=>{
        const shop=ensureShop(part);
        if(shop)inlineShops.push(shop.id);
      });
    }

    const shops=inlineShops.length>0?inlineShops:(currentShopId&&currentShopId!=='all'?[currentShopId]:[]);
    itemsToMerge.push({name:itemName,cat:currentCat,shops});
  });

  let toggled=0,added=0;
  itemsToMerge.forEach(({name,cat,shops})=>{
    const low=name.toLowerCase();
    const existing=list.items.find(i=>i.name.toLowerCase()===low||stemWord(i.name.toLowerCase())===stemWord(low));
    if(existing){existing.needed=true;toggled++;}
    else{list.items.push({id:list.nextId++,name:normName(name),cat,shops,needed:true,starred:false});added++;}
  });

  persistList();_closeModal();render();
  if(added||toggled){
    setTimeout(()=>alert(`Import done: ${toggled} item${toggled!==1?'s':''} toggled on, ${added} item${added!==1?'s':''} added.`),100);
  }
};

/* ══════════════════════════════════════
   THEMES
══════════════════════════════════════ */
let previewPrevThemeId = null;
let editorVars = {}; // live vars being edited in the colour picker

window._applyTheme=id=>{
  applyTheme(id);
  modal_extra=null;
  renderModal();renderHeader();renderSyncBar();renderBurger();
};

window._deleteTheme=id=>{
  if(BUILT_IN_THEMES[id])return;
  delete customThemes[id];
  localStorage.setItem('sl_custom_themes',JSON.stringify(customThemes));
  if(activeThemeId===id)applyTheme('dark');
  modal_extra=null;renderModal();
};

// Open the colour picker editor. id=null means new from current theme.
window._openThemeEditor=id=>{
  const src = id ? (allThemes()[id]||BUILT_IN_THEMES.dark) : (allThemes()[activeThemeId]||BUILT_IN_THEMES.dark);
  editorVars = {...(BUILT_IN_THEMES.dark.vars), ...src.vars};
  previewPrevThemeId = activeThemeId;
  modal_extra = {
    editing: true,
    isNew: !id,
    editingId: id||null,
    name: id ? src.name : src.name+' copy',
    vars: {...editorVars},
    font: src.font||SYSTEM_FONT
  };
  renderModal();
};

// Called live as colour pickers change
window._updateEditorVar=(key,val)=>{
  if(!modal_extra||!modal_extra.editing)return;
  modal_extra.vars[key]=val;
  editorVars[key]=val;
  // Apply live to page for instant feedback (without saving)
  document.documentElement.style.setProperty(key,val);
};

window._previewThemeEditor=()=>{
  if(!modal_extra||!modal_extra.editing)return;
  const fontEl=document.getElementById('te-font');
  const font=fontEl?.value.trim()||SYSTEM_FONT;
  modal_extra.font=font;
  // Apply all vars + font
  Object.entries(modal_extra.vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
  document.body.style.fontFamily=font;
  if(font!==SYSTEM_FONT)ensureGoogleFonts();
  modal_extra.previewing=true;
  renderModal();renderHeader();renderSyncBar();renderBurger();
};

window._saveThemeEditor=()=>{
  if(!modal_extra||!modal_extra.editing)return;
  const nameEl=document.getElementById('te-name');
  const fontEl=document.getElementById('te-font');
  const errEl=document.getElementById('theme-err');
  const name=nameEl?.value.trim();
  if(!name){if(errEl)errEl.textContent='Enter a theme name.';return;}
  const font=fontEl?.value.trim()||SYSTEM_FONT;
  const fullVars={...BUILT_IN_THEMES.dark.vars,...modal_extra.vars};
  // Use existing id if editing, new id if creating
  const id=modal_extra.editingId||('custom_'+Date.now());
  customThemes[id]={name,font,vars:fullVars};
  localStorage.setItem('sl_custom_themes',JSON.stringify(customThemes));
  applyTheme(id);
  previewPrevThemeId=null;
  modal_extra=null;
  renderModal();renderHeader();renderSyncBar();renderBurger();
};

// Load theme vars from pasted text into the picker UI
window._loadThemeFromText=()=>{
  const ta=document.getElementById('theme-import-ta');
  const errEl=document.getElementById('theme-err');
  const text=ta?.value.trim();
  if(!text){if(errEl)errEl.textContent='Paste theme text first.';return;}
  const {vars,font}=parseThemeTemplate(text);
  if(Object.keys(vars).length<3){if(errEl)errEl.textContent='Could not parse enough values — check the format.';return;}
  if(!modal_extra||!modal_extra.editing)return;
  modal_extra.vars={...BUILT_IN_THEMES.dark.vars,...vars};
  if(font)modal_extra.font=font;
  renderModal();
};

function _clipCopyText(text,btnId,origLabel){
  function ok(){const b=document.getElementById(btnId);if(b){b.textContent='✓ Copied!';setTimeout(()=>{b.textContent=origLabel},2000)}}
  function fail(){const b=document.getElementById(btnId);if(b){b.textContent='Copy failed';setTimeout(()=>{b.textContent=origLabel},1800)}}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok).catch(()=>execCopy(text,ok,fail));
  else execCopy(text,ok,fail);
}

window._exportCurrentTheme=()=>{
  const current=allThemes()[activeThemeId]||BUILT_IN_THEMES.dark;
  _clipCopyText(themeTemplate(current),'exp-cur-btn','Copy current theme');
};

window._exportBlankTemplate=()=>{
  _clipCopyText(themeTemplate(BUILT_IN_THEMES.dark),'exp-tpl-btn','Copy blank template');
};

window._cancelThemePreview=()=>{
  if(previewPrevThemeId){applyTheme(previewPrevThemeId);previewPrevThemeId=null;}
  modal_extra=null;editorVars={};
  _closeModal();
};

/* ══════════════════════════════════════
   SHOP DRAG REORDER
══════════════════════════════════════ */
function _initShopDrag(){
  const list_el=document.getElementById('shop-drag-list');
  if(!list_el||!list)return;
  let dragSrcId=null;
  list_el.querySelectorAll('.shop-drag-row[draggable]').forEach(row=>{
    row.addEventListener('dragstart',e=>{
      dragSrcId=row.dataset.id;
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>row.style.opacity='0.4',0);
    });
    row.addEventListener('dragend',()=>{row.style.opacity='';list_el.querySelectorAll('.shop-drag-row').forEach(r=>r.classList.remove('drag-over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';list_el.querySelectorAll('.shop-drag-row').forEach(r=>r.classList.remove('drag-over'));row.classList.add('drag-over');});
    row.addEventListener('drop',e=>{
      e.preventDefault();
      if(!dragSrcId||dragSrcId===row.dataset.id)return;
      const srcIdx=list.shopTabs.findIndex(t=>t.id===dragSrcId);
      const dstIdx=list.shopTabs.findIndex(t=>t.id===row.dataset.id);
      if(srcIdx<0||dstIdx<0)return;
      const [moved]=list.shopTabs.splice(srcIdx,1);
      list.shopTabs.splice(dstIdx,0,moved);
      persistList();
      renderModal();
      renderHeader();
    });
  });
}

/* ══════════════════════════════════════
   HELP
══════════════════════════════════════ */
window._openHelp=async()=>{
  modal='help';modal_extra='loading';render();
  try{
    const res=await fetch('https://raw.githubusercontent.com/ciaratamay/A-List/main/README.md');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const md=await res.text();
    modal_extra=md;
  }catch(e){
    modal_extra='__error__';
  }
  renderModal();
};

// Simple markdown-ish renderer for help
function renderMarkdown(md){
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^---$/gm,'<hr>')
    .replace(/\n/g,'<br>');
}

render();
